# Worker Cloudflare : interface (dossier dist/), API et vérification quotidienne.
name = "concerts-delphine"
main = "worker/index.ts"
compatibility_date = "2026-10-01"

# L'interface construite par Vite est servie par le Worker lui-même.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Stockage : artistes, concerts trouvés, mails déjà envoyés.
# Remplacer l'id par celui donné par : npx wrangler kv namespace create DONNEES
[[kv_namespaces]]
binding = "DONNEES"
id = "A_REMPLACER_PAR_L_ID_DU_NAMESPACE"

# Vérification chaque jour à 6h UTC (8h à Paris l'été, 7h l'hiver).
[triggers]
crons = ["0 6 * * *"]

[observability]
enabled = true

# Réglages non secrets. Les secrets (TICKETMASTER_KEY, RESEND_KEY, MAIL_DESTINATAIRE,
# ACCESS_CODE, et BANDSINTOWN_APP_ID en option) se posent avec : npx wrangler secret put NOM
[vars]
# Expéditeur des mails. onboarding@resend.dev ne peut écrire qu'à l'adresse du compte Resend
# (voir README) ; avec un domaine vérifié chez Resend : "Mes concerts <concerts@mondomaine.fr>".
MAIL_EXPEDITEUR = "Mes concerts <onboarding@resend.dev>"
# Pays surveillés, séparés par des virgules (ex. "FR,BE,CH").
PAYS = "FR"
# Rappel envoyé X jours avant un concert suivi.
RAPPEL_JOURS = "3"
# Adresse de l'appli, ajoutée en lien dans les mails (à remplir après le premier déploiement).
APP_URL = ""
