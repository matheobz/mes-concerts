# Construit l'APK Android signé et le publie dans GitHub Releases.
# - Pousser un tag "v..." (ex. v2.0.0) : build + release (le lien "dernière version" pointe dessus).
# - Lancement manuel (onglet Actions > APK Android > Run workflow) : build seul, APK en artefact.
# Secrets nécessaires (Settings > Secrets and variables > Actions) : voir README.
name: APK Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Vérifier que les secrets sont posés
        env:
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          manque=0
          for s in TICKETMASTER_KEY ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!s}" ]; then echo "::error::Secret GitHub manquant : $s"; manque=1; fi
          done
          exit $manque

      - name: Installer les dépendances
        run: npm ci

      - name: Tests
        run: npm test

      - name: Construire l'interface et la tâche de fond (avec la clé Ticketmaster)
        env:
          VITE_TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
        run: npm run build

      - name: Copier dans le projet Android
        run: npx cap sync android

      - name: Recréer le keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mes-concerts.keystore"

      - name: Compiler l'APK signé
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mes-concerts.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('0.0.{0}', github.run_number) }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Vérifier la signature
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk mes-concerts.apk
          outils=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$outils"/apksigner verify --print-certs mes-concerts.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mes-concerts-apk
          path: mes-concerts.apk

      - name: Publier la release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Mes concerts ${{ github.ref_name }}
          files: mes-concerts.apk
          make_latest: true
          body: |
            Appli Android « Mes concerts ».
            Pour installer ou mettre à jour : télécharger mes-concerts.apk sur le téléphone puis l'ouvrir.
            Une mise à jour s'installe par-dessus l'ancienne version, sans perdre les données.
